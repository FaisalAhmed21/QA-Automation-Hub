name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  newman:
    name: Newman API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: task-manager-api-tests/backend/requirements.txt

      - name: Install Django backend dependencies
        working-directory: task-manager-api-tests/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        working-directory: task-manager-api-tests/backend
        run: python manage.py migrate --noinput

      - name: Start Django server
        working-directory: task-manager-api-tests/backend
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          echo $! > django.pid

      - name: Wait for Django server
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/tasks | grep -qE '^(200|401|403)$'; then
              echo "Django server is ready"
              exit 0
            fi
            echo "Waiting for Django server... ($i/30)"
            sleep 2
          done
          echo "Django server failed to start"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task-manager-api-tests/package-lock.json

      - name: Install Newman dependencies
        working-directory: task-manager-api-tests
        run: npm ci

      - name: Run Newman API tests
        working-directory: task-manager-api-tests
        run: npm run test:api

      - name: Stop Django server
        if: always()
        working-directory: task-manager-api-tests/backend
        run: |
          if [ -f django.pid ]; then
            kill "$(cat django.pid)" || true
          fi

      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-report
          path: task-manager-api-tests/reports/api-report.html
          retention-days: 14